<!doctype html>
<meta charset="utf-8">
<title>SafeRide autotest</title>
<style>
  body { background:#0a0a0b; color:#e8e8ea; font:14px/1.6 ui-monospace,Consolas,monospace; padding:20px; }
  video { width:480px; background:#000; display:block; margin:12px 0; }
  pre { white-space:pre-wrap; }
  .done { color:#4ade80; font-size:18px; }
</style>
<h2 id="status">running…</h2>
<video id="vid" muted playsinline preload="auto"></video>
<pre id="out"></pre>
<script>
// Runs itself on load and POSTs results back, so a browser we cannot drive
// remotely (Firefox) can still report the same measurements as Chrome.
const V = document.getElementById('vid');
const OUT = document.getElementById('out');
const log = o => { OUT.textContent += JSON.stringify(o) + "\n"; };

const VARIANTS = [
  { label: "H.264 -g3 58MB",        src: "ladder/g3_1080_crf20.mp4" },
  { label: "VP9 -g3 53.6MB",        src: "ladder/g3_1080_vp9.webm" },
  { label: "H.264 -g1 96MB",        src: "ladder/g1_1080_crf20.mp4" },
  { label: "AV1 -g3 37.3MB",        src: "ladder/g3_1080_av1.mp4" }
];

const pc = (a,p) => { const s=[...a].sort((x,y)=>x-y); return s[Math.min(s.length-1,Math.floor(s.length*p))]; };

async function bufferFully(v, ms) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    let e = 0;
    for (let i=0;i<v.buffered.length;i++) e = Math.max(e, v.buffered.end(i));
    if (v.duration && e >= v.duration - 0.3) return true;
    await new Promise(r => setTimeout(r, 150));
  }
  return false;
}

async function stress(src, label) {
  V.pause(); V.removeAttribute('src'); V.load();
  await new Promise(r => setTimeout(r, 400));
  V.preload = 'auto'; V.src = src; V.load();

  // canPlay check first - Firefox may refuse a codec entirely
  const okType = await new Promise(res => {
    const t = setTimeout(() => res(false), 15000);
    V.addEventListener('loadedmetadata', () => { clearTimeout(t); res(true); }, { once:true });
    V.addEventListener('error', () => { clearTimeout(t); res(false); }, { once:true });
  });
  if (!okType) return { label, error: "failed to load / unsupported codec" };

  const buffered = await bufferFully(V, 60000);
  await new Promise(r => setTimeout(r, 400));

  // same deterministic seek sequence as the Chrome run
  const lat = []; let seed = 12345;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i=0;i<40;i++) {
    const s = performance.now();
    await new Promise(res => {
      const d = () => { V.removeEventListener('seeked', d); res(); };
      V.addEventListener('seeked', d);
      V.currentTime = rnd() * V.duration;
    });
    lat.push(performance.now() - s);
  }
  return { label, fullyBuffered: buffered, duration: +V.duration.toFixed(6),
           p50:+pc(lat,.5).toFixed(1), p95:+pc(lat,.95).toFixed(1), max:+Math.max(...lat).toFixed(1) };
}

(async () => {
  const results = { engine: navigator.userAgent, results: [] };
  for (const v of VARIANTS) {
    document.getElementById('status').textContent = "testing " + v.label + " …";
    try { const r = await stress(v.src, v.label); results.results.push(r); log(r); }
    catch (e) { const r = { label: v.label, error: String(e) }; results.results.push(r); log(r); }
  }
  document.getElementById('status').textContent = "DONE";
  document.getElementById('status').className = "done";
  await fetch('/results', { method:'POST', body: JSON.stringify(results) });
})();
</script>
